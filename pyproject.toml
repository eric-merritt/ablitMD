[project]
name = "ablitMD"
version = "0.1.0"
description = "Multi-dimensional categorical abliteration research sandbox"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9",
    "transformers",
    "tqdm",
    "accelerate",
    "huggingface-hub",
    "datasets>=4.8.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "causal-conv1d",
    "flash-attn",
    "flash-linear-attention",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.2.post1/causal_conv1d-1.6.2.post1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
flash-attn = { path = "pkgs/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
