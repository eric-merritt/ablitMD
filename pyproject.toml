[project]
name = "ablitMD"
version = "0.1.0"
description = "Multi-dimensional categorical abliteration research sandbox"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.40",
    "tqdm",
    "accelerate",
    "huggingface-hub",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
