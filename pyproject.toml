[project]
name = "ablitMD"
version = "0.1.0"
description = "Multi-dimensional categorical abliteration research sandbox"
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1+cu128",
    "transformers",
    "tqdm",
    "accelerate",
    "huggingface-hub",
    "datasets>=4.8.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "causal-conv1d",
    "flash-attn",
    "flash-linear-attention",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash-attn = { path = "pkgs/flash_attn-2.8.3.whl" }
causal-conv1d = { path = "pkgs/causal_conv1d-1.7.0-cp312-cp312-linux_x86_64.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["torch"]
