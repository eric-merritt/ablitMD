[project]
name = "ablitMD"
version = "0.1.0"
description = "Multi-dimensional categorical abliteration research sandbox"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.40",
    "tqdm",
    "accelerate",
    "huggingface-hub",
    "datasets>=4.8.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
