[project]
name = "ablitMD"
version = "0.1.0"
description = "Multi-dimensional categorical abliteration research sandbox"
requires-python = "==3.10.20"
dependencies = [
    "torch>=2.12",
    "transformers",
    "tqdm",
    "accelerate",
    "huggingface-hub",
    "datasets>=4.8.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "causal-conv1d",
    "flash-attn-3",
    "flash-linear-attention",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "bitsandbytes>=0.49.2",
    "torchao>=0.18.0",
    "compressed-tensors>=0.18.0",
    "hqq",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flash-attn-3 = { path = "pkgs/flash_attn_3-3.0.0+20260609.cu130torch2120cxx11abitrue.bc58ab-cp310-abi3-linux_x86_64.whl" }
causal-conv1d = { path = "pkgs/causal_conv1d-1.6.1-cp310-cp310-linux_x86_64.whl" }
hqq = { git = "https://github.com/dropbox/hqq.git" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["torch"]
